<div id="task-{{ task.id }}" class="group flex items-center justify-between p-2.5 rounded bg-slate-950 border border-slate-800/80 hover:border-slate-700 transition">
  <div class="flex items-center gap-2.5 min-w-0 flex-1 mr-2">
    <button hx-post="{% url 'toggle_task' task.id %}" 
            hx-target="#task-{{ task.id }}" 
            hx-swap="outerHTML" 
            title="Mark {% if task.is_completed %}incomplete{% else %}complete{% endif %}"
            class="w-4 h-4 flex-shrink-0 rounded border flex items-center justify-center transition {% if task.is_completed %}border-emerald-500 bg-emerald-500/20 text-emerald-400{% else %}border-slate-700 hover:border-slate-500{% endif %}">
      {% if task.is_completed %}✓{% endif %}
    </button>
    <div class="min-w-0 flex-1">
      <div class="text-xs truncate {% if task.is_completed %}line-through text-slate-500{% else %}text-slate-200{% endif %}">
        {{ task.title }}
      </div>
      {% if task.due_date %}
        <div class="text-[10px] text-slate-500 mt-0.5">Due {{ task.due_date|date:"M d" }}</div>
      {% endif %}
    </div>
  </div>
  <div class="flex items-center gap-1.5 flex-shrink-0">
    <!-- Quick Assign Employee Dropdown -->
    <form hx-post="{% url 'assign_task' task.id %}" hx-target="#task-{{ task.id }}" hx-swap="outerHTML" class="inline-flex items-center">
      {% csrf_token %}
      <select name="assigned_to" onchange="this.form.requestSubmit()" 
              title="Assign to employee"
              class="bg-slate-900 border border-slate-800 hover:border-slate-700 text-[10px] {% if task.assigned_to %}text-sky-400 font-semibold bg-sky-950/40 border-sky-800/60{% else %}text-slate-400{% endif %} rounded px-1.5 py-0.5 focus:outline-none focus:border-sky-500 cursor-pointer transition">
        <option value="" {% if not task.assigned_to %}selected{% endif %}>+ Assign</option>
        {% for u in users %}
          <option value="{{ u.username }}" {% if task.assigned_to == u.username %}selected{% endif %}>
            @{{ u.username }}
          </option>
        {% endfor %}
      </select>
    </form>
    {% if task.priority == 'HIGH' %}
      <span class="text-[9px] font-bold tracking-widest text-rose-400 bg-rose-950/40 border border-rose-900/50 px-1.5 py-0.5 rounded">HIGH</span>
    {% elif task.priority == 'LOW' %}
      <span class="text-[9px] font-medium tracking-wider text-slate-400 bg-slate-900 border border-slate-800 px-1.5 py-0.5 rounded">LOW</span>
    {% endif %}
    <button hx-post="{% url 'delete_task' task.id %}"
            hx-confirm="Are you sure you want to delete this task?"
            hx-swap="none"
            class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 transition p-1 rounded hover:bg-slate-800"
            title="Delete task">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    </button>
  </div>
</div>
