{% extends "base.html" %}
{% block content %}
<div class="min-h-full flex items-center justify-center w-full px-4">
  <div class="max-w-md w-full space-y-6 bg-slate-900 p-8 rounded-xl border border-slate-800">
    <div>
      <h2 class="text-2xl font-bold text-center text-white">Create Account</h2>
    </div>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="w-full py-2 px-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-medium text-sm transition">Sign Up</button>
    </form>
    <div class="text-center text-xs text-slate-500">
      Already registered? <a href="{% url 'login' %}" class="text-sky-400 hover:underline">Login here</a>
    </div>
  </div>
</div>
{% endblock %}
