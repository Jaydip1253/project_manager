{% extends "base.html" %}
{% block content %}
<div class="min-h-full flex items-center justify-center w-full px-4">
  <div class="max-w-md w-full space-y-6 bg-slate-900 p-8 rounded-xl border border-slate-800">
    <div>
      <h2 class="text-2xl font-bold text-center text-white">Sign In</h2>
      <p class="text-xs text-center text-slate-400 mt-1">Access your projects & AI copilot</p>
    </div>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-slate-400 block mb-1">Username</label>
          <input type="text" name="username" required class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 block mb-1">Password</label>
          <input type="password" name="password" required class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
        </div>
      </div>
      <button type="submit" class="w-full py-2 px-4 bg-sky-600 hover:bg-sky-500 text-white rounded font-medium text-sm transition">Login</button>
    </form>
    <div class="text-center text-xs text-slate-500">
      Don't have an account? <a href="{% url 'register' %}" class="text-sky-400 hover:underline">Register</a>
    </div>
  </div>
</div>
{% endblock %}
